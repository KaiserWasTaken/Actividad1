<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 10 - Calculadora fahrenheit</title>
</head>
<body>
    <h1>Calculadora de temperatura</h1>
    <p>Convierte grados Celsius a Fahrenheit</p>

    <form id="formulario">
        <label for="CCC">Grados Celsius:</label>
        <input type="number" id="CCC" name="CCC" required>
        <button type="submit">Convertir</button>
    </form>

    <textarea id="resultado" readonly></textarea>
    
    <br>

    <script>
        const formulario = document.getElementById('formulario');
        const resultado = document.getElementById('resultado');

        formulario.addEventListener('submit', function(event) {
            event.preventDefault();
            const celsius = parseFloat(document.getElementById('CCC').value);
            const fahrenheit = (celsius * 9/5) + 32;
            resultado.value = `${celsius}°C son ${fahrenheit.toFixed(2)}°F`;
        });
    </script>
    <button type="button" onclick="window.location.href='index.html';">Volver al index</button>
</body>
</html>
