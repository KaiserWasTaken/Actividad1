<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 11 - Kilometros a Millas</title>
</head>
<body>
    <h1>Conversor de distancia</h1>
    <p>Convierte kilómetros a millas</p>

    <form id="formulario">
        <label for="KKK">Kilómetros:</label>
        <input type="number" id="KKK" name="KKK" required>
        <button type="submit">Convertir</button>
    </form>

    <br>

    <textarea id="resultado" readonly></textarea>

    <script>
        const formulario = document.getElementById('formulario');
        const resultado = document.getElementById('resultado');

        formulario.addEventListener('submit', function(event) {
            event.preventDefault();
            const kilometros = parseFloat(document.getElementById('KKK').value);
            const millas = kilometros * 0.621371;
            resultado.value = `${kilometros} km son ${millas.toFixed(5)} millas`;
        });
    </script>
    <button type="button" onclick="window.location.href='index.html';">Volver al index</button>
</body>
</html>
