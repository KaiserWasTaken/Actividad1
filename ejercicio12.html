<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 12 - Conversor MXN a USD</title>
</head>
<body>
    <h1>Conversor de divisas</h1>
    <p>Convierte pesos mexicanos a dólares estadounidenses</p>

    <form id="formulario">
        <label for="MXN">Pesos Mexicanos (MXN):</label>
        <input type="number" id="MXN" name="MXN" required>
        <button type="submit">Convertir</button>
    </form>

    <br>

    <textarea id="resultado" readonly></textarea>

    <script>
        const formulario = document.getElementById('formulario');
        const resultado = document.getElementById('resultado');
        const tasaDeCambio = 0.055; // 1 MXN = 0.05 USD

        formulario.addEventListener('submit', function(event) {
            event.preventDefault();
            const pesos = parseFloat(document.getElementById('MXN').value);
            const dolares = pesos * tasaDeCambio;
            resultado.value = `${pesos} MXN son ${dolares.toFixed(2)} USD`;
        });
    </script>
    <button type="button" onclick="window.location.href='index.html';">Volver al index</button>
</body>
</html>
