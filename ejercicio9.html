<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | DevSolutions</title>
    <link rel="stylesheet" href="css/ejercicio9.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Contactanos</h1>
        <p class="subtitulo">Tienes dudas? Escribenos y te lo responderemos en 24h.</p>

        <form class="formulario">
            <div class="grupo-formulario">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Ej: Ana Perez" required>
            </div>

            <div class="grupo-doble">
                <div class="grupo-formulario">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Ej: ana@ejemplo.com" required>
                </div>
                <div class="grupo-formulario">
                    <label for="telefono">Teléfono <span>(Opcional)</span></label>
                    <input type="tel" id="telefono" placeholder="Ej: 55-1234-5678">
                </div>
            </div>

            <div class="grupo-formulario">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" rows="5" placeholder="Describe tu consulta..." required></textarea>
            </div>

            <button type="submit" class="boton-enviar">
                Enviar mensaje 
            </button>
        </form>
    </div>
    <button type="button" onclick="window.location.href='index.html';">Volver al index</button>
</body>
</html>
