<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio 13 - Verificacion edad para votar</title>
</head>
<body>
    <h1>Verificación de edad para votar</h1>
    <p>Ingresa tu edad para verificar si puedes votar</p>

    <form id="formulario">
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" required>
        <button type="submit">Verificar</button>
    </form>

    <br>

    <textarea id="resultado" readonly></textarea>

    <script>
        const formulario = document.getElementById('formulario');
        const resultado = document.getElementById('resultado');

        formulario.addEventListener('submit', function(event) {
            event.preventDefault();
            const edad = parseInt(document.getElementById('edad').value);
            if (edad >= 18) {
                resultado.textContent = `Puedes votar.`;
            } else {
                resultado.textContent = `No puedes votar.`;
            }
        });
    </script>
    <button type="button" onclick="window.location.href='index.html';">Volver al index</button>
</body>
</html>
